[package]
name = "magnetbrains-api"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "compression-full", "trace"] }

# Database
sqlx = { version = "0.7", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "bigdecimal"] }

# Redis
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"] }

# Auth
jsonwebtoken = "9"
argon2 = "0.5"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utils
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
validator = { version = "0.18", features = ["derive"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
hmac = "0.12"
reqwest = { version = "0.12", features = ["json"] }
base64 = "0.22"
slug = "0.1"

# AWS
aws-config = "1"
aws-sdk-s3 = "1"
aws-sdk-ses = "1"
aws-smithy-types = "1"

# BigDecimal for money — must match sqlx's version (0.3)
bigdecimal = { version = "0.3", features = ["serde"] }
